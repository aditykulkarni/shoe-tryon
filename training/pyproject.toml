[project]
name = "footpose"
version = "0.1.0"
description = "Foot keypoint model for the shoe try-on app"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "onnx>=1.17",
    "onnxscript>=0.2",
    "onnxruntime>=1.20",
]

[project.scripts]
footpose-check = "footpose.check:main"
footpose-toy-data = "footpose.toydata:main"
footpose-train = "footpose.train:main"
footpose-export = "footpose.export:main"
footpose-predict = "footpose.predict:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

# On Windows and Linux, get PyTorch builds with NVIDIA (CUDA) support.
# On a Mac the normal build already uses the Apple GPU.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[tool.uv]
package = true

[tool.setuptools]
packages = ["footpose"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
